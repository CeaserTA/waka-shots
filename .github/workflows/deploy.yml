name: Test, build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ceaserta/waka-shots

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waka-shots-backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, gd, bcmath, zip, pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: waka-shots-backend/package-lock.json

      - run: npm ci && npm run build

      # phpunit.xml points tests at in-memory SQLite, array mail and sync queue.
      - run: cp .env.example .env && php artisan key:generate

      - run: php artisan test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: waka-shots-backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # One registry version per build, without extra untagged attestation manifests.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy stack files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: waka-shots-backend/deploy/compose.yaml,waka-shots-backend/deploy/Caddyfile
          target: /opt/waka
          strip_components: 2

      - name: Pull and restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/waka
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export APP_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker compose pull app queue
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            # Removes every image no container is using, including old releases.
            # Any earlier release can still be pulled back from GHCR by its commit tag.
            docker image prune -af

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Keep only the 10 most recent images in GHCR
        uses: actions/delete-package-versions@v5
        with:
          package-name: waka-shots
          package-type: container
          min-versions-to-keep: 10
