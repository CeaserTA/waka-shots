[build]
builder = "NIXPACKS"
buildCommand = "composer install --optimize-autoloader --no-dev && npm ci && npm run build && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force"

[deploy]
startCommand = "php artisan serve --host=0.0.0.0 --port=${PORT}"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3